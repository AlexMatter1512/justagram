<div id="justagram-menu-overlay" style="
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 9999999;
    display: none;
    align-items: center;
    justify-content: center;
">
    <div id="justagram-menu" style="
        background: #262626;
        border-radius: 16px;
        width: 90%;
        max-width: 360px;
        max-height: 80vh;
        overflow-y: auto;
        padding: 20px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    ">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="color: white; margin: 0; font-size: 18px; font-weight: 600;">JustAgram Settings</h2>
            <div id="justagram-close-btn" style="
                width: 32px;
                height: 32px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                border-radius: 50%;
                background: #363636;
            ">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#8e8e8e">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </div>
        </div>

        <p style="color: #8e8e8e; font-size: 13px; margin: 0 0 16px 0;">Hide distracting content</p>

        <label class="justagram-toggle-item" data-key="hideReels">
            <span>
                <span class="jg-setting-name">Reels</span>
                <small>Hide Reels tab and content</small>
            </span>
            <input type="checkbox" role="switch" aria-label="Reels">
        </label>
        <label class="justagram-toggle-item" data-key="hideStories">
            <span>
                <span class="jg-setting-name">Stories</span>
                <small>Hide Stories bar at top</small>
            </span>
            <input type="checkbox" role="switch" aria-label="Stories">
        </label>
        <label class="justagram-toggle-item" data-key="hideExplore">
            <span>
                <span class="jg-setting-name">Explore</span>
                <small>Hide Explore page content</small>
            </span>
            <input type="checkbox" role="switch" aria-label="Explore">
        </label>
        <label class="justagram-toggle-item" data-key="hideFeed">
            <span>
                <span class="jg-setting-name">Home Feed</span>
                <small>Hide main feed on home page</small>
            </span>
            <input type="checkbox" role="switch" aria-label="Home Feed">
        </label>
        <label class="justagram-toggle-item" data-key="hideSuggestedReels">
            <span>
                <span class="jg-setting-name">Suggested Reels</span>
                <small>Stop doom-scrolling on shared reels</small>
            </span>
            <input type="checkbox" role="switch" aria-label="Suggested Reels">
        </label>
        <label class="justagram-toggle-item" data-key="hideThreads">
            <span>
                <span class="jg-setting-name">Threads Promo</span>
                <small>Hide Threads promotion links</small>
            </span>
            <input type="checkbox" role="switch" aria-label="Threads Promo">
        </label>
        <label class="justagram-toggle-item" data-key="hideNotes">
            <span>
                <span class="jg-setting-name">Notes</span>
                <small>Hide friends note on top of chat list</small>
            </span>
            <input type="checkbox" role="switch" aria-label="Notes">
        </label>
        <label class="justagram-toggle-item" data-key="dmOnlyMode">
            <span>
                <span class="jg-setting-name">DM Only Mode</span>
                <small>Focus on DMs and keep only Notes visible</small>
            </span>
            <input type="checkbox" role="switch" aria-label="DM Only Mode">
        </label>
        <label class="justagram-toggle-item" data-key="commitmentMode">
            <span>
                <span class="jg-setting-name">Commitment Mode</span>
                <small>Lock the filters you enable on this profile</small>
            </span>
            <input type="checkbox" role="switch" aria-label="Commitment Mode">
        </label>

        <dialog id="jg-commit-warning" aria-labelledby="jg-warning-title" aria-describedby="jg-warning-message">
            <h3 id="jg-warning-title"></h3>
            <p id="jg-warning-message"></p>
            <form method="dialog">
                <button value="cancel" autofocus>Cancel</button>
                <button value="accept" id="jg-confirm-lock">Enable and lock</button>
            </form>
        </dialog>
        <p id="jg-settings-error" role="alert"></p>

        <button id="justagram-switch-profile" type="button" style="width: 100%; min-height: 44px; margin-top: 20px; border: 1px solid #555; border-radius: 10px; background: #292929; color: white; font: inherit; cursor: pointer;">Switch profile</button>
        <div style="margin-top: 20px; text-align: center;">
            <p style="color: #8e8e8e; font-size: 11px; margin: 0;">JustAgram <span id="jg-version">v1.0</span></p>
        </div>
    </div>
</div>
